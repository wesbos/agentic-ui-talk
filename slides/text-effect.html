<!doctype html>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

  rel="stylesheet"

<style>
  :root {
    color-scheme: light;
  }
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
    background: #fff;
    font-family: "DM Sans", system-ui, sans-serif;
  }

  .grunge-canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    grid-area: 1 / 1;
  }

  #content {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 24px;
    background: black;
    color: white;
  }

  #content span {
    font-family: "Archivo Black", system-ui, sans-serif;
    font-size: 150px;
    font-weight: 400;
    line-height: 0.92;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    text-align: center;
    /* display: block; */
    /* white-space: nowrap; */
    background-image: url("./images/Texturelabs_Paper_310L.jpg");
    background-size: 800px;
    background-position: center;
    -webkit-background-clip: text;
    color: transparent;
  }
  .roses {
    background-image:
      /* url("./images/Texturelabs_Paper_310L.jpg"), */ radial-gradient(
      circle,
      pink 0%,
      transparent 70%
    );
    /* background-blend-mode: multiply; */
  }
</style>

<div id="content" class="grunge">

  <span>I lie here under water</span>
  <span>Something feels wrong</span>
  <span>And oh, hang me like roses</span>
  <span>You can have something pretty</span>
  <span>When I'm dried out and dead</span> -->
  <span
    >No matter how long I lie here under water Something feels wrong And oh,
    <span class="roses">hang me like roses</span>
    You can have something pretty When I'm dried out and dead</span
  >
</div>
